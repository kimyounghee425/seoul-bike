name: SeoulBike
options:
  bundleIdPrefix: com.kimyonghee
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  SeoulBike:
    type: application
    platform: iOS
    sources: [SeoulBike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimyonghee.seoulbike
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: SeoulBike/Info.plist
      properties:
        CFBundleDisplayName: 따릉길
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 내 주변 따릉이 대여소를 찾고 경로를 안내하는 데 사용해요.
        SeoulOpenAPIKey: $(SEOUL_OPEN_API_KEY)
        KakaoRestAPIKey: $(KAKAO_REST_API_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            openapi.seoul.go.kr:
              NSExceptionAllowsInsecureHTTPLoads: true
