name: SeoulBike
options:
  bundleIdPrefix: com.ttabi
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM.git
    from: "2.12.0"
targets:
  SeoulBike:
    type: application
    platform: iOS
    sources: [SeoulBike]
    dependencies:
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ttabi.app
        DEVELOPMENT_TEAM: RYT9AL5P9S
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
    info:
      path: SeoulBike/Info.plist
      properties:
        CFBundleDisplayName: 따비
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light # 밝은 화면 기준 디자인, 다크 모드에서 글씨 안 보이는 문제
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 내 주변 따릉이 대여소를 찾고 경로를 안내하는 데 사용해요.
        SeoulOpenAPIKey: $(SEOUL_OPEN_API_KEY)
        KakaoRestAPIKey: $(KAKAO_REST_API_KEY)
        KakaoNativeAppKey: $(KAKAO_NATIVE_APP_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            openapi.seoul.go.kr:
              NSExceptionAllowsInsecureHTTPLoads: true
